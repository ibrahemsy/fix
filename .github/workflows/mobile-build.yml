name: Flutter mobile build

on:
  push:
    branches:
      - release/web-mobile-platform
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/asset_flow_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform folders and camera permissions
        run: bash tool/prepare_platforms.sh
      - name: Install packages
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build Flutter Web
        run: flutter build web --release
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-flow-android-apk
          path: mobile/asset_flow_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
